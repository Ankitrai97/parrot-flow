[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parrot-flow"
version = "0.2.1"
description = "Local-first Windows voice dictation with GPU acceleration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "sounddevice>=0.4.6",
  "keyboard>=0.13.5",
  "faster-whisper>=1.1.0",
  "pywebview>=6.2",
]

[project.optional-dependencies]
gpu = [
  "ctranslate2>=4.5",
  "nvidia-cublas-cu12>=12.0",
  "nvidia-cuda-runtime-cu12>=12.0",
  "nvidia-cudnn-cu12>=9.0",
]
dev = ["pytest>=8.0", "ruff>=0.8"]
build = ["pyinstaller>=6.11"]

[project.scripts]
parrot-flow = "localdictate.__main__:main"

[tool.setuptools.packages.find]
include = ["localdictate*"]
exclude = ["desktop*", "outputs*", "tests*", "work*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
